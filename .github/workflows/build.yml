name: Build CHISAKE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract CHISAKE project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="CHISAKE-Firebase-Registration-Login.zip"
          test -f "$ARCHIVE" || { echo "Missing $ARCHIVE in repository root"; exit 1; }
          mkdir -p extracted
          unzip -q -o "$ARCHIVE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo "settings.gradle.kts not found inside archive"; exit 1; }
          test -f "$PROJECT_DIR/app/google-services.json" || { echo "Firebase app/google-services.json missing"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHISAKE-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
