name: Build CHISAKE APK

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract CHISAKE project
    shell: bash
    run: |
      set -euo pipefail

      ARCHIVE="CHISAKE Android project.zip"

      if [ ! -f "$ARCHIVE" ]; then
        echo "ERROR: $ARCHIVE was not found in the repository root."
        exit 1
      fi

      mkdir -p extracted
      unzip -o "$ARCHIVE" -d extracted

      PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"

      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Android project settings.gradle.kts was not found."
        exit 1
      fi

      if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
        echo "ERROR: Firebase google-services.json was not found in the app folder."
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build CHISAKE APK
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"

      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug
      else
        gradle --no-daemon assembleDebug
      fi

  - name: Upload CHISAKE APK
    uses: actions/upload-artifact@v4
    with:
      name: CHISAKE-APK
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
